<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payments — Profit Stack</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/payments.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
</head>
<body class="app-body">
<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><span class="brand-icon">◈</span><span class="brand-name">Profit Stack</span></div>
    <nav class="sidebar-nav">
      <a href="dashboard.html"  class="nav-item"><span class="nav-icon">▦</span>Dashboard</a>
      <a href="products.html"   class="nav-item"><span class="nav-icon">⬡</span>Products</a>
      <a href="customers.html"  class="nav-item"><span class="nav-icon">◉</span>Customers</a>
      <a href="sales.html"      class="nav-item"><span class="nav-icon">◈</span>Sales</a>
      <a href="payments.html"   class="nav-item active"><span class="nav-icon">⬟</span>Payments</a>
      <a href="analytics.html"  class="nav-item"><span class="nav-icon">▣</span>Analytics</a>
      <a href="reports.html"    class="nav-item"><span class="nav-icon">▤</span>Reports</a>
    </nav>
    <div class="sidebar-footer"><button class="logout-btn" onclick="logout()">⏻ Logout</button></div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
      <h1 class="page-title">Payments</h1>
      <div class="topbar-right"><span class="user-badge" id="userBadge">—</span></div>
    </header>

    <!-- Summary Cards -->
    <section class="pay-stats" id="payStats">
      <div class="pay-stat-card green">
        <div class="ps-label">Total Collected</div>
        <div class="ps-value" id="psCollected">—</div>
      </div>
      <div class="pay-stat-card blue">
        <div class="ps-label">Total Payments</div>
        <div class="ps-value" id="psCount">—</div>
      </div>
      <div class="pay-stat-card amber">
        <div class="ps-label">Pending</div>
        <div class="ps-value" id="psPending">—</div>
      </div>
      <div class="pay-stat-card red">
        <div class="ps-label">Failed</div>
        <div class="ps-value" id="psFailed">—</div>
      </div>
    </section>

    <!-- Table Section -->
    <section class="module-section">
      <div class="section-header">
        <h2 class="section-title">Payment History</h2>
        <button class="btn-primary" onclick="openModal()">+ Record Payment</button>
      </div>
      <div class="table-controls">
        <input type="text" id="searchInput" class="search-input" placeholder="Search customer or method…" oninput="debounce()"/>
        <select id="statusFilter" class="filter-select" onchange="loadPayments()">
          <option value="">All Status</option>
          <option value="completed">Completed</option>
          <option value="pending">Pending</option>
          <option value="failed">Failed</option>
          <option value="refunded">Refunded</option>
        </select>
      </div>
      <div class="table-wrapper">
        <table class="data-table">
          <thead>
            <tr><th>#</th><th>Customer</th><th>Amount</th><th>Method</th><th>Status</th><th>Date</th><th>Notes</th><th>Actions</th></tr>
          </thead>
          <tbody id="payTableBody"></tbody>
        </table>
      </div>
      <div class="pagination" id="pagination"></div>
    </section>
  </main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="modalTitle">Record Payment</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="payId"/>
      <div class="form-grid">
        <div class="form-group">
          <label>Customer</label>
          <select id="fCustomer" class="form-input"><option value="">Select…</option></select>
        </div>
        <div class="form-group">
          <label>Amount (₹)</label>
          <input type="number" id="fAmount" class="form-input" min="0" step="0.01" placeholder="0.00"/>
        </div>
        <div class="form-group">
          <label>Method</label>
          <select id="fMethod" class="form-input">
            <option value="cash">Cash</option>
            <option value="card">Card</option>
            <option value="upi">UPI</option>
            <option value="bank_transfer">Bank Transfer</option>
            <option value="cheque">Cheque</option>
          </select>
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="fStatus" class="form-input">
            <option value="completed">Completed</option>
            <option value="pending">Pending</option>
            <option value="failed">Failed</option>
            <option value="refunded">Refunded</option>
          </select>
        </div>
        <div class="form-group">
          <label>Date</label>
          <input type="date" id="fDate" class="form-input"/>
        </div>
        <div class="form-group">
          <label>Linked Sale ID <span style="color:var(--text-muted)">(optional)</span></label>
          <input type="number" id="fSaleId" class="form-input" placeholder="Sale #"/>
        </div>
        <div class="form-group full-width">
          <label>Notes</label>
          <input type="text" id="fNotes" class="form-input" placeholder="Reference, transaction ID…"/>
        </div>
      </div>
      <div id="formError" class="form-error hidden"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="savePayment()">Save</button>
    </div>
  </div>
</div>

<script src="js/auth.js"></script>
<script src="js/payments.js"></script>
</body>
</html>
