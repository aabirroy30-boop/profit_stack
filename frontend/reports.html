<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reports — Profit Stack</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/reports.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
</head>
<body class="app-body">
<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><span class="brand-icon">◈</span><span class="brand-name">Profit Stack</span></div>
    <nav class="sidebar-nav">
      <a href="dashboard.html"  class="nav-item"><span class="nav-icon">▦</span>Dashboard</a>
      <a href="products.html"   class="nav-item"><span class="nav-icon">⬡</span>Products</a>
      <a href="customers.html"  class="nav-item"><span class="nav-icon">◉</span>Customers</a>
      <a href="sales.html"      class="nav-item"><span class="nav-icon">◈</span>Sales</a>
      <a href="payments.html"   class="nav-item"><span class="nav-icon">⬟</span>Payments</a>
      <a href="analytics.html"  class="nav-item"><span class="nav-icon">▣</span>Analytics</a>
      <a href="reports.html"    class="nav-item active"><span class="nav-icon">▤</span>Reports</a>
    </nav>
    <div class="sidebar-footer"><button class="logout-btn" onclick="logout()">⏻ Logout</button></div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
      <h1 class="page-title">Reports</h1>
      <div class="topbar-right"><span class="user-badge" id="userBadge">—</span></div>
    </header>

    <!-- Report Builder -->
    <section class="report-builder">
      <div class="builder-card">
        <h2 class="builder-title">Generate Report</h2>
        <div class="builder-controls">
          <div class="ctrl-group">
            <label>Report Type</label>
            <select id="reportType" class="form-input" onchange="onTypeChange()">
              <option value="summary">Summary Report</option>
              <option value="sales">Sales Report</option>
              <option value="payments">Payments Report</option>
              <option value="inventory">Inventory Report</option>
            </select>
          </div>
          <div class="ctrl-group" id="dateFromGroup">
            <label>From Date</label>
            <input type="date" id="dateFrom" class="form-input"/>
          </div>
          <div class="ctrl-group" id="dateToGroup">
            <label>To Date</label>
            <input type="date" id="dateTo" class="form-input"/>
          </div>
          <div class="ctrl-group" id="statusGroup">
            <label>Status Filter</label>
            <select id="reportStatus" class="form-input">
              <option value="">All</option>
              <option value="completed">Completed</option>
              <option value="pending">Pending</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
          <div class="ctrl-group btn-group">
            <button class="btn-primary" onclick="generateReport()">▶ Generate</button>
            <button class="btn-secondary" onclick="downloadCSV()">↓ CSV</button>
            <button class="btn-secondary" onclick="printReport()">⎙ Print</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Report Output -->
    <section class="module-section" id="reportOutput" style="display:none">
      <div class="section-header">
        <h2 class="section-title" id="reportHeading">Report</h2>
        <span class="report-meta" id="reportMeta"></span>
      </div>
      <div id="summaryCards" class="summary-cards"></div>
      <div class="table-wrapper" id="reportTableWrap">
        <table class="data-table" id="reportTable">
          <thead id="reportThead"></thead>
          <tbody id="reportTbody"></tbody>
        </table>
      </div>
    </section>

    <!-- Report History -->
    <section class="module-section">
      <div class="section-header"><h2 class="section-title">Report History</h2></div>
      <div class="table-wrapper">
        <table class="data-table">
          <thead><tr><th>#</th><th>Title</th><th>Type</th><th>Generated By</th><th>Date</th></tr></thead>
          <tbody id="historyBody"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<script src="js/auth.js"></script>
<script src="js/reports.js"></script>
</body>
</html>
