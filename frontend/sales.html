<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sales — Profit Stack</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/sales.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="app-body">
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand"><span class="brand-icon">◈</span><span class="brand-name">Profit Stack</span></div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item"><span class="nav-icon">▦</span>Dashboard</a>
        <a href="products.html" class="nav-item"><span class="nav-icon">⬡</span>Products</a>
        <a href="customers.html" class="nav-item"><span class="nav-icon">◉</span>Customers</a>
        <a href="sales.html" class="nav-item active"><span class="nav-icon">◈</span>Sales</a>
        <a href="payments.html" class="nav-item"><span class="nav-icon">⬟</span>Payments</a>
        <a href="reports.html" class="nav-item"><span class="nav-icon">▤</span>Reports</a>
      </nav>
      <div class="sidebar-footer"><button class="logout-btn" onclick="logout()">⏻ Logout</button></div>
    </aside>

    <main class="main-content">
      <!-- Topbar -->
      <header class="topbar">
        <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
        <h1 class="page-title">Sales</h1>
        <div class="topbar-right">
          <span class="user-badge" id="userBadge">—</span>
        </div>
      </header>

      <!-- Analytics Cards -->
      <section class="stats-row" id="statsRow">
        <div class="stat-card accent-green">
          <div class="stat-label">Total Revenue</div>
          <div class="stat-value" id="statRevenue">—</div>
        </div>
        <div class="stat-card accent-blue">
          <div class="stat-label">Total Sales</div>
          <div class="stat-value" id="statCount">—</div>
        </div>
        <div class="stat-card accent-amber">
          <div class="stat-label">Avg. Order Value</div>
          <div class="stat-value" id="statAvg">—</div>
        </div>
      </section>

      <!-- Monthly Chart -->
      <section class="chart-section">
        <div class="chart-card wide">
          <div class="chart-header">
            <span class="chart-title">Monthly Revenue</span>
            <select id="yearFilter" class="filter-select" onchange="loadMonthlyChart()">
              <option value="2025">2025</option>
              <option value="2024">2024</option>
            </select>
          </div>
          <canvas id="monthlyChart" height="90"></canvas>
        </div>
      </section>

      <!-- Sales Table -->
      <section class="module-section">
        <div class="section-header">
          <h2 class="section-title">Sales Records</h2>
          <button class="btn-primary" onclick="openModal()">+ New Sale</button>
        </div>
        <div class="table-controls">
          <input type="text" id="searchInput" class="search-input" placeholder="Search customer or product…" oninput="debounceSearch()"/>
          <select id="statusFilter" class="filter-select" onchange="loadSales()">
            <option value="">All Status</option>
            <option value="completed">Completed</option>
            <option value="pending">Pending</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
        <div class="table-wrapper">
          <table class="data-table">
            <thead>
              <tr><th>#</th><th>Customer</th><th>Product</th><th>Qty</th><th>Unit Price</th><th>Total</th><th>Status</th><th>Date</th><th>Actions</th></tr>
            </thead>
            <tbody id="salesTableBody"></tbody>
          </table>
        </div>
        <div class="pagination" id="pagination"></div>
      </section>
    </main>
  </div>

  <!-- Sale Modal -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modalTitle">New Sale</h3>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="saleId"/>
        <div class="form-grid">
          <div class="form-group">
            <label>Customer</label>
            <select id="fCustomer" class="form-input"><option value="">Select…</option></select>
          </div>
          <div class="form-group">
            <label>Product</label>
            <select id="fProduct" class="form-input" onchange="autofillPrice()"><option value="">Select…</option></select>
          </div>
          <div class="form-group">
            <label>Quantity</label>
            <input type="number" id="fQty" class="form-input" min="1" placeholder="1" oninput="calcTotal()"/>
          </div>
          <div class="form-group">
            <label>Unit Price (₹)</label>
            <input type="number" id="fPrice" class="form-input" min="0" step="0.01" placeholder="0.00" oninput="calcTotal()"/>
          </div>
          <div class="form-group">
            <label>Total Amount (₹)</label>
            <input type="text" id="fTotal" class="form-input" readonly placeholder="Auto-calculated"/>
          </div>
          <div class="form-group">
            <label>Status</label>
            <select id="fStatus" class="form-input">
              <option value="completed">Completed</option>
              <option value="pending">Pending</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
          <div class="form-group full-width">
            <label>Sale Date</label>
            <input type="date" id="fDate" class="form-input"/>
          </div>
        </div>
        <div id="formError" class="form-error hidden"></div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn-primary" onclick="saveSale()">Save Sale</button>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/sales.js"></script>
</body>
</html>
